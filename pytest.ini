[pytest]
testpaths = test/simulation
addopts =
    --tb=short
    --ignore=test/simulation/integration/test_general_methods_tricontinental_c24000.py
    --ignore=test/simulation/integration/test_general_methods_vici_m6_pump.py
    --ignore=test/simulation/unit/test_tricontinental_c24000.py
    --ignore=test/simulation/unit/test_vici_m6_pump.py
    
# Pump timing tests are excluded from the default simulation suite because
# they rely on real elapsed-time behavior and can hang in unattended CI.

pythonpath = .

markers =
    hardware: marks tests that require physical instrument connections via serial