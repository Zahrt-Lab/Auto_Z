[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-zahrt"
version = "3.0.0"
description = "Automated laboratory instrumentation control system for chemical experiments"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Professor Andrew Zahrt"},
]
keywords = ["automation", "chemistry", "laboratory", "instrumentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pandas>=2.0.0",
    "pyserial>=3.5",
    "matplotlib>=3.5.0",
    "numpy>=1.23.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[project.scripts]
auto-zahrt-gui = "user_interface.methods_gui:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = [".conda*", "test*", "docs*", "*.egg-info*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.toml"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--import-mode=importlib"
pythonpath = [".", "test"]
markers = [
    "hardware: marks tests requiring physical hardware on a COM port (deselect with '-m not hardware')",
    "mirror_box: marks tests requiring MirrorBox365nm device",
    "tc720: marks tests requiring TC720 temperature controller device",
    "tricontinental: marks tests requiring Tricontinental C24000 pump device",
    "vici_m6: marks tests requiring VICI M6 pump device",
    "vici_valve: marks tests requiring VICI selector valve devices",
]
